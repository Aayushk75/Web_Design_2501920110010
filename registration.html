<html>
<head><title>Registration Form</title></head>
<body bgcolor="#E6F2FF">
<center>
<h2 style="color: #003366;">Registration Form</h2>
<form>
<table border="1" bgcolor="#FFFFFF" cellpadding="6" bordercolor="#B0C4DE">
    <tr>
        <td><b>Name:</b></td>
        <td><input type="text" name="name"></td>
    </tr>
    <tr>
        <td><b>Password:</b></td>
        <td><input type="password" name="password"></td>
    </tr>
    <tr>
        <td><b>E-mail ID:</b></td>
        <td><input type="text" name="email"></td>
    </tr>
    <tr>
        <td><b>Phone Number:</b></td>
        <td><input type="text" name="phone"></td>
    </tr>
    <tr>
        <td><b>Sex:</b></td>
        <td>
            <input type="radio" name="sex" value="Male"> Male 
            <input type="radio" name="sex" value="Female"> Female
        </td>
    </tr>
    <tr>
        <td><b>Date of Birth:</b></td>
        <td>
            <select name="day"><option>Day</option></select>
            <select name="month"><option>Month</option></select>
            <select name="year"><option>Year</option></select>
        </td>
    </tr>
    <tr>
        <td><b>Languages Known:</b></td>
        <td>
            <input type="checkbox" name="lang" value="English"> English
            <input type="checkbox" name="lang" value="Telugu"> Telugu<br>
            <input type="checkbox" name="lang" value="Hindi"> Hindi
            <input type="checkbox" name="lang" value="Tamil"> Tamil
        </td>
    </tr>
    <tr>
        <td><b>Address:</b></td>
        <td><textarea name="address" rows="3" cols="20"></textarea></td>
    </tr>
    <tr>
        <td colspan="2" align="center" bgcolor="#F0F8FF">
            <input type="submit" value="Submit" style="background-color: #4CAF50; color: white; padding: 5px 12px; border: none; font-weight: bold;">
            &nbsp;&nbsp;
            <input type="reset" value="Reset" style="background-color: #f44336; color: white; padding: 5px 12px; border: none; font-weight: bold;">
        </td>
    </tr>
</table>
</form>
</center>
</body>
</html>
